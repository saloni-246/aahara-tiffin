<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAHARA Customer Login</title><style>body{margin:0;font:16px system-ui;background:#f8f3ee;color:#2c1e1b}.wrap{max-width:460px;margin:10vh auto;padding:20px}.card{background:#fffaf5;border:1px solid #dccbb8;border-radius:22px;padding:28px;box-shadow:0 18px 40px #4c301b1f}h1{font-size:2.2rem}.brand{font-weight:800;letter-spacing:.14em;color:#8d5a34;text-decoration:none}label{display:block;margin:16px 0;color:#6a4f46;font-weight:600}input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #d8c5b2;border-radius:12px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:999px;background:#5c3318;color:#fff;font-weight:700;font:inherit;cursor:pointer}.note{font-size:.85rem;color:#6a4f46;margin-top:18px}a{color:#8d5a34}</style></head><body><main class="wrap"><a class="brand" href="index.html">AAHARA / 아하라</a><section class="card"><p>Customer access</p><h1>Welcome back to your familiar meal.</h1><p>Sign in to see your personalized menu, select tiffins and manage subscriptions.</p><form id="login"><label>Email<input id="email" type="email" value="aisha@example.com" required></label><label>Password<input id="password" type="password" value="aahara123" required></label><button>Sign in</button></form><p class="note">Demo: aisha@example.com / aahara123</p><a href="index.html">Continue exploring the public menu</a></section></main><script>document.getElementById('login').onsubmit=e=>{e.preventDefault();if(email.value==='aisha@example.com'&&password.value==='aahara123'){sessionStorage.setItem('aaharaCustomer','true');location.href='customer.html'}else alert('Use aisha@example.com / aahara123')};</script></body></html>
